<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz · Yadav Authentication Project</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">Yadav Auth</a>
    </div>
  </header>

  <main class="dashboard">
    <div class="quiz-container">
      <h1 class="auth-title" style="margin-bottom:20px;">Quick Quiz</h1>
      <p class="auth-subtitle">Answer the questions below. Your score will be saved.</p>
      <form id="quizForm" novalidate>
        <div id="questionsContainer"></div>
        <div class="quiz-actions">
          <button type="submit" class="btn">Submit Answers</button>
          <a href="leaderboard.html" class="btn btn-secondary">View Leaderboard</a>
        </div>
      </form>
      <div id="quizResult" class="status-message"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="auth.html">Auth</a>
        <a href="quiz.html">Quiz</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="legal/about.html">About</a>
      </div>
      <p class="footer-copy">&copy; 2026 Yadav Authentication Project. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script type="module" src="quiz.js"></script>
</body>
</html>
